<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetX — Fleet Telematics & GPS Tracking Software</title>
<meta name="description" content="FleetX is a modern fleet telematics and GPS tracking SaaS platform for real-time vehicle tracking, driver behavior, fuel analytics, maintenance, alerts and geofencing.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<!-- =========================================================
LOGIN
========================================================= -->
<main id="login" class="page active">
<div class="auth-page">
<div style="position: absolute; top: 24px; right: 24px; display: flex; gap: 10px; z-index: 100;">
<button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle Theme">
<i class="fa-solid fa-moon"></i>
</button>
<button class="icon-btn rtl-control" onclick="toggleRTL()" title="RTL" aria-label="Toggle RTL">
<i class="fa-solid fa-right-left"></i>
</button>
</div>
<div class="auth-box">
<div class="auth-card">
<div class="logo" onclick="showPage('home1')" style="margin-bottom: 24px; justify-content: center; font-size: 28px; cursor: pointer;">
<span class="logo-mark">
<i class="fa-solid fa-route"></i>
</span>
FleetX
</div>
<h1>Welcome back</h1>
<p class="auth-subtitle">
Sign in to your fleet manager workspace
</p>
<!-- Social login moved below -->
<form onsubmit="loginSubmit(event)">
<div class="form-group">
<label>Email Address</label>
<input class="form-control"
type="email"
placeholder="[fleet.manager@company.com](mailto:fleet.manager@company.com)"
required>
</div>
<div class="form-group">
<label>Password</label>
<input class="form-control"
type="password"
placeholder="••••••••"
required>
</div>
<div class="auth-actions">
<label class="remember">
<input type="checkbox">
Remember me
</label>
<button type="button"
class="forgot"
onclick="forgotPassword()">
Forgot password?
</button>
</div>
<button class="btn btn-primary auth-submit" type="submit">
Sign In
</button>
</form>
<div class="divider" style="margin: 20px 0;">
or continue with
</div>
<div class="social-login">
<button class="social-auth google" onclick="socialLogin('Google')">
<i class="fa-brands fa-google"></i>
Google
</button>
<button class="social-auth" onclick="socialLogin('Apple')">
<i class="fa-brands fa-apple"></i>
Apple
</button>
</div>
<div class="auth-bottom">
Don't have an account?
<button onclick="showPage('register')">
Request access
</button>
</div>
</div>

</div>
</div>
</main>
<button class="top-btn" id="topBtn"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
<i class="fa-solid fa-arrow-up"></i>
</button>
<script src="js/main.js"></script>
</body>
</html>
